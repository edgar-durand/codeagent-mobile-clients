name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Tag vX.Y.Z → publishes codeam-cli to npm, the VS Code extension to the VS
# Code Marketplace and Open VSX, and the JetBrains plugin to JetBrains
# Marketplace (stable channel). Drafts a GitHub Release with all three
# artifacts attached. Pre-release tags (vX.Y.Z-rc.N) skip the JetBrains
# marketplace push.
#
# Topology: `setup` runs first to validate the tag and expose the version
# as a job output, then `publish-cli` / `publish-vsc` / `publish-jetbrains`
# fan out in parallel. The final `release` job waits for all three, prepends
# git-cliff notes to each app's CHANGELOG.md, and creates the GitHub Release
# with every artifact attached.

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Opt into Node.js 24 runtime for GitHub JavaScript actions (silences the
  # deprecation warning from Node 20 default — will be removed 2026-09-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup:
    name: Validate tag and expose version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Publishing version: $VERSION"

  # Publishes @codeam/shared to npm. Runs in PARALLEL with publish-cli —
  # publish-cli deliberately does NOT depend on this job, because the CLI
  # and the IDE plugins bundle the shared package's SOURCE at build time
  # and never resolve the published artifact. A failure here must never
  # block a client release.
  #
  # ⚠️ If this job fails on `npm publish`, the most likely cause is that
  # the NPM_TOKEN repo secret lacks publish rights on the @codeam npm
  # scope (historically it only published the unscoped `codeam-cli`).
  # Fix: mint an Automation token with publish access to the @codeam
  # scope (it already owns @codeam/ide-*), update the NPM_TOKEN secret,
  # and re-run this job — the version guard makes retries idempotent.
  publish-shared:
    name: Publish @codeam/shared to npm
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Patch shared version
        working-directory: packages/shared
        run: npm version "${{ needs.setup.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install workspace dependencies
        run: npm ci

      - name: Shared typecheck
        working-directory: packages/shared
        run: npm run typecheck

      - name: Shared tests
        working-directory: packages/shared
        run: npm run test

      - name: Build shared
        working-directory: packages/shared
        run: npm run build

      - name: Publish @codeam/shared to npm
        working-directory: packages/shared
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          # Idempotent publish — same guard as the CLI job: skip when this
          # exact version already exists on the registry so retries
          # (re-tagged release, hotfix re-push) stay green.
          if npm view "@codeam/shared@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@codeam/shared@$VERSION already published — skipping npm publish"
            exit 0
          fi
          npm publish --access public

  publish-cli:
    name: Publish CLI to npm
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Patch CLI version
        working-directory: apps/cli
        run: npm version "${{ needs.setup.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install workspace dependencies
        run: npm ci

      - name: CLI typecheck
        working-directory: apps/cli
        run: npm run typecheck

      - name: CLI tests
        working-directory: apps/cli
        run: npm run test

      - name: Build CLI
        working-directory: apps/cli
        env:
          # PostHog ingestion key baked at build time via tsup's
          # `define` (apps/cli/tsup.config.ts). Public-by-design — same
          # write-key shape mobile + landing bake. Leave the GitHub
          # secret blank to disable telemetry across published builds.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: npm run build

      - name: Pack CLI tarball (for GitHub Release artifact)
        working-directory: apps/cli
        run: npm pack

      - name: Publish CLI to npm
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.setup.outputs.version }}
          # `npm publish` triggers `prepublishOnly: "npm run build"`,
          # which re-runs tsup. Without these env vars present the
          # second build's `define` substitutes `__POSTHOG_API_KEY__`
          # with `""` and overwrites the dist/ from the "Build CLI"
          # step — telemetry silently disabled in every published
          # build. (#192 root cause: PostHog dashboard showed zero
          # CLI events for 60 days despite the secret being set on
          # the repo since 2026-05-24.)
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          # Idempotent publish — skip if this exact version already
          # exists on the registry. npm itself returns 403 on republish,
          # which is correct semantics but turns retries (re-tagged
          # release, hotfix re-push, anything) into red runs. With the
          # guard, downstream jobs (VS Code, JetBrains, GitHub Release
          # changelog) still run on retry without us first having to
          # `git tag -d`.
          if npm view "codeam-cli@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::codeam-cli@$VERSION already published — skipping npm publish"
            exit 0
          fi
          npm publish --access public

      - name: Upload CLI tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-tgz
          path: apps/cli/codeam-cli-${{ needs.setup.outputs.version }}.tgz

  # Builds + pushes the CodeAgent Box runtime image (apps/box) to GHCR on every
  # stable tag. Previously a MANUAL `docker build`, which is exactly how the box
  # drifted a node major behind the codespace bootstrap (2026-07-16: the box was
  # still node:20-slim while the ACP adapter had moved to engines.node ">=22").
  # Automating it here keeps the image's node + pinned codeam-cli in lockstep
  # with the release, so a rescued user never boots on a stale runtime.
  #
  # Depends on publish-cli: the image does `npm install -g codeam-cli@<version>`,
  # so that version must already be live on npm.
  publish-box:
    name: Build and publish CodeAgent Box image
    needs: [setup, publish-cli]
    if: needs.setup.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Wait for codeam-cli on npm
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          for i in $(seq 1 40); do
            if npm view "codeam-cli@${VERSION}" version >/dev/null 2>&1; then
              echo "codeam-cli@${VERSION} is live on npm"; exit 0
            fi
            echo "waiting for codeam-cli@${VERSION} on npm (attempt ${i})..."; sleep 5
          done
          echo "::error::codeam-cli@${VERSION} never appeared on npm — cannot build the box image against it"
          exit 1

      - name: Build and push box image (node 22 base, pinned CLI)
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/codeam-box"
          docker build \
            --build-arg "CODEAM_CLI_VERSION=${VERSION}" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            apps/box
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

      # Keep the wrapper repo's Codespaces PREBUILD in sync with the image we just
      # pushed. The prebuild snapshots `codeam-box:latest` and only rebuilds on a
      # devcontainer CONFIG change (not when `:latest` moves), so bump a version
      # marker to trigger a rebuild. This is LOAD-BEARING for deploy speed: the
      # codespace deploy skips the ~24s codeam-cli reinstall ONLY when the prebuild's
      # baked CLI == npm latest — a stale prebuild silently brings the reinstall back.
      # Best-effort (the image is already published); needs a PAT with `contents:write`
      # on CodeAgentMobile/codeam-codespace (secret WRAPPER_REPO_PAT).
      - name: Refresh the wrapper-repo Codespaces prebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WRAPPER_REPO_PAT }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::WRAPPER_REPO_PAT not set — skipping prebuild refresh (deploy will reinstall the CLI until the prebuild is refreshed manually)"
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/CodeAgentMobile/codeam-codespace.git" wrapper
          cd wrapper
          f=.devcontainer/devcontainer.json
          if grep -qE '// prebuild-refresh:' "$f"; then
            sed -i -E "s|// prebuild-refresh:.*|// prebuild-refresh: codeam-cli ${VERSION}|" "$f"
          else
            # insert the marker right after the opening brace
            sed -i "0,/{/s|{|{\n  // prebuild-refresh: codeam-cli ${VERSION}|" "$f"
          fi
          git config user.name "codeam-release"
          git config user.email "release@codeagent-mobile.com"
          if git commit -am "chore: refresh prebuild → codeam-box:latest (codeam-cli ${VERSION}) [skip ci]"; then
            git push
            echo "Prebuild refresh triggered on CodeAgentMobile/codeam-codespace"
          else
            echo "devcontainer.json unchanged — nothing to refresh"
          fi

  trigger-api-integration:
    # Cross-repo regression gate: as soon as codeam-cli@<version>
    # is live on npm, dispatch the api-v2-integration workflow in
    # `codeagent-mobile` so its docker-e2e installs THIS exact
    # version inside the surrogate container and runs the full
    # api ↔ CLI integration suite. Without this, CLI tag pushes
    # never exercised the e2e — verified empirically when v2.23.13
    # / .14 / .15 each shipped api ↔ CLI breakage that nobody
    # caught until prod traffic surfaced it.
    #
    # `repository_dispatch` is the right tool here (`gh workflow
    # run` would need a PAT with `actions:write` on the cross-repo;
    # the dispatch event accepts a `client_payload` and works with
    # the same `repo` scope on the target's secret).
    #
    # Non-blocking by design: this job uses `if: success()` on
    # `publish-cli` but doesn't block the release flow's `release`
    # finalisation. A failed e2e shows up as a red dispatch run on
    # the api-v2 side and notifies the maintainer; we don't
    # un-publish the npm tag retroactively. The "fail loud" is the
    # GitHub UI surfacing the integration run as a Check.
    name: Trigger api-v2 integration tests
    needs: [setup, publish-cli]
    runs-on: ubuntu-latest
    if: ${{ needs.setup.outputs.is_prerelease != 'true' }}
    permissions:
      contents: read
    steps:
      - name: Dispatch api-v2-integration
        env:
          # Same PAT the issue-forwarding workflow uses. Needs `repo`
          # scope on codeagent-mobile (private repo doesn't accept a
          # bare `GITHUB_TOKEN` from this workflow).
          DISPATCH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::CROSS_REPO_PAT not set — skipping api-v2-integration trigger. Add a PAT (repo scope on codeagent-mobile) to enable the regression gate."
            exit 0
          fi
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/edgar-durand/codeagent-mobile/dispatches \
            -d "{\"event_type\":\"cli-released\",\"client_payload\":{\"cliVersion\":\"$VERSION\"}}"
          echo "::notice::Dispatched api-v2-integration for codeam-cli@$VERSION"

  publish-vsc:
    name: Publish VS Code plugin
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Patch VS Code plugin version
        working-directory: apps/vsc-plugin
        run: npm version "${{ needs.setup.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install workspace dependencies
        run: npm ci

      - name: Build VS Code plugin
        working-directory: apps/vsc-plugin
        env:
          # PostHog ingestion key baked at build time via esbuild's
          # `define` (apps/vsc-plugin/esbuild.js). Same write-key
          # shape the CLI bakes. Without this env block esbuild
          # inlines an empty string and telemetry is silently
          # disabled in published builds.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: npm run build

      - name: Package VS Code plugin (.vsix)
        working-directory: apps/vsc-plugin
        run: |
          npx --no-install @vscode/vsce package --no-dependencies --out "codeagent-mobile-${{ needs.setup.outputs.version }}.vsix"

      - name: Publish VS Code plugin to Marketplace
        working-directory: apps/vsc-plugin
        run: |
          npx --no-install @vscode/vsce publish --no-dependencies --pat "$VSCE_PAT" \
            --packagePath "codeagent-mobile-${{ needs.setup.outputs.version }}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish VS Code plugin to Open VSX
        working-directory: apps/vsc-plugin
        run: |
          npx ovsx publish --no-dependencies --pat "$OVSX_TOKEN" \
            "codeagent-mobile-${{ needs.setup.outputs.version }}.vsix"
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsc-vsix
          path: apps/vsc-plugin/codeagent-mobile-${{ needs.setup.outputs.version }}.vsix
          if-no-files-found: error

  publish-jetbrains:
    name: Publish JetBrains plugin
    needs: setup
    if: ${{ !contains(needs.setup.outputs.version, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The Gradle build + IntelliJ Platform SDK + the verifier's IDE
      # distributions (several GB each) no longer fit next to the
      # runner's preinstalled toolchains — v2.52.4 died twice with
      # "No space left on device", which kills the WORKER itself (so
      # verifyPlugin's continue-on-error can't save the job). Drop the
      # big toolchains we never use here (~25 GB freed).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Patch JetBrains plugin version
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          sed -i -E "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" apps/jetbrains-plugin/build.gradle.kts
          sed -i -E "s|<version>[^<]+</version>|<version>$VERSION</version>|" apps/jetbrains-plugin/src/main/resources/META-INF/plugin.xml

      - name: Build JetBrains plugin
        working-directory: apps/jetbrains-plugin
        env:
          # PostHog ingestion key baked at build time via the gradle
          # task in build.gradle.kts (writes GeneratedBuildConfig.kt
          # with the key as a const). Without this env block gradle's
          # `providers.environmentVariable("POSTHOG_API_KEY")` resolves
          # to empty and telemetry is silently disabled in the
          # published plugin.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: ./gradlew clean buildPlugin

      - name: Verify JetBrains plugin
        working-directory: apps/jetbrains-plugin
        # Best-effort: the IntelliJ Platform Plugin Verifier has been
        # crashing internally on a subset of the IDE matrix (Worker
        # finishes with an exception unrelated to our plugin shape).
        # Run as a diagnostic but never fail the release on it — the
        # publish step itself is the authoritative gate, and the
        # marketplace runs its own server-side validation on upload.
        run: ./gradlew verifyPlugin || echo "::warning::verifyPlugin failed; continuing release"
        continue-on-error: true

      - name: Validate JetBrains Marketplace token before publish
        # Tokens generated at the WRONG location (personal
        # `/author/me/tokens` rather than the vendor's
        # `/author/<vendor>/tokens`) fail mid-publish with an unhelpful
        # "Marketplace service scope is missing" error AFTER gradle
        # has already burned ~2 min building the plugin. Pre-flight
        # against `/api/users/me` so we fail fast with the exact
        # remediation surfaced from JetBrains' own response body.
        #
        # Two bugs in the prior preflight (fixed here):
        #   1. URL was `/api/auth/me` which doesn't exist on
        #      plugins.jetbrains.com → curl returned 404 even for
        #      valid tokens. The marketplace user endpoint is
        #      `/api/users/me`.
        #   2. `-fsS` (fail on HTTP 4xx) combined with `-w '%{http_code}'`
        #      AND `|| echo "000"` concatenated both writers to STDOUT
        #      on any 4xx response — the captured `STATUS` came out as
        #      `404000` (real status code + fallback) instead of `404`.
        #      Drop `-f`: curl writes the body even on 4xx, `-w` writes
        #      the actual status, and `|| echo "000"` only fires when
        #      curl ITSELF fails (network error / DNS / cert).
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::JETBRAINS_MARKETPLACE_TOKEN is not set. Generate one from the CodeAgent-Mobile vendor's tokens page (Vendors → CodeAgent-Mobile → Tokens — NOT the personal /author/me/tokens page, those lack Marketplace scope)."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/jb_auth.json -w '%{http_code}' \
            -H "Authorization: Bearer $PUBLISH_TOKEN" \
            https://plugins.jetbrains.com/api/users/me \
            || echo "000")
          if [ "$STATUS" != "200" ]; then
            BODY=$(cat /tmp/jb_auth.json 2>/dev/null || echo '')
            echo "::error::JetBrains Marketplace token auth failed (HTTP $STATUS). Body: ${BODY}. The 'Marketplace service scope is missing' message means the token was created on the user's personal tokens page; publishing needs a token from the vendor's tokens page (Vendors → CodeAgent-Mobile → Tokens). Update the JETBRAINS_MARKETPLACE_TOKEN secret with the new vendor-scoped token."
            exit 1
          fi

      - name: Publish JetBrains plugin to Marketplace
        working-directory: apps/jetbrains-plugin
        run: ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          # `publishPlugin` depends on `buildPlugin`, so gradle will
          # re-bake `GeneratedBuildConfig.kt` if the up-to-date check
          # invalidates. Mirror the build step's env so we never ship
          # a publish with the key stripped out — same root cause as
          # the CLI's `prepublishOnly` regression that hid CLI events
          # from PostHog for 60 days.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}

      - name: Locate JetBrains plugin archive
        id: jb
        run: |
          ZIP=$(ls apps/jetbrains-plugin/build/distributions/*.zip | head -n 1)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload JetBrains plugin archive
        uses: actions/upload-artifact@v7
        with:
          name: jb-zip
          path: ${{ steps.jb.outputs.zip }}
          if-no-files-found: error

  release:
    name: Draft GitHub Release + commit changelog
    needs: [setup, publish-cli, publish-vsc, publish-jetbrains]
    if: |
      always() &&
      needs.publish-cli.result == 'success' &&
      needs.publish-vsc.result == 'success' &&
      (needs.publish-jetbrains.result == 'success' || needs.publish-jetbrains.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout (full history for git-cliff)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download CLI tarball
        uses: actions/download-artifact@v8
        with:
          name: cli-tgz
          path: dist/cli

      - name: Download VSIX
        uses: actions/download-artifact@v8
        with:
          name: vsc-vsix
          path: dist/vsc

      - name: Download JetBrains plugin archive
        if: ${{ needs.publish-jetbrains.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: jb-zip
          path: dist/jb

      - name: Resolve JetBrains plugin archive path
        id: jb
        if: ${{ needs.publish-jetbrains.result == 'success' }}
        run: |
          ZIP=$(ls dist/jb/*.zip | head -n 1)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from commits (git-cliff)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Commit updated CHANGELOGs directly to main
        run: |
          set -euo pipefail

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "git-cliff produced no release notes (no conventional commits between tags). Nothing to commit."
            exit 0
          fi

          # The tag checkout has no in-flight version bumps in this job (those
          # happen in publish-* jobs which don't push). Switch to main cleanly.
          git fetch origin main
          git checkout main

          for APP in cli vsc-plugin jetbrains-plugin; do
            FILE="apps/$APP/CHANGELOG.md"
            awk -v notes_file="RELEASE_NOTES.md" '
              BEGIN { inserted = 0 }
              /^## \[/ && !inserted {
                while ((getline line < notes_file) > 0) print line
                print ""
                inserted = 1
              }
              { print }
            ' "$FILE" > "$FILE.new"
            mv "$FILE.new" "$FILE"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/*/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing new to add to CHANGELOGs — maybe all commits between tags were skippable chores."
            exit 0
          fi
          git commit -m "chore(changelog): notes for v${{ needs.setup.outputs.version }} [skip ci]"
          git push origin main

      - name: Create GitHub Release
        # Run even if the changelog commit step failed — the registries already
        # received the release, so we always want the GitHub Release to exist
        # with the built artifacts attached.
        if: always() && needs.setup.outputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.setup.outputs.version }}
          body_path: RELEASE_NOTES.md
          append_body: true
          files: |
            dist/cli/codeam-cli-${{ needs.setup.outputs.version }}.tgz
            dist/vsc/codeagent-mobile-${{ needs.setup.outputs.version }}.vsix
            ${{ steps.jb.outputs.zip }}

  # ── Did npm ACTUALLY get it? ──────────────────────────────────────────────
  # 2026-08-14→18: four consecutive releases (v2.65.8 … v2.65.11) failed to
  # reach npm because the granular NPM_TOKEN had expired. The publish jobs went
  # red, nobody was watching the Actions tab, and npm stayed on 2.65.7 for four
  # days. This job does not trust a job status — it re-reads the REGISTRY and
  # fails if either package is missing at this tag's version, so "release is
  # green" can only mean "npm serves it".
  verify-published:
    name: Verify npm serves this version
    needs: [setup, publish-shared, publish-cli]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: npm view codeam-cli + @codeam/shared
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -uo pipefail
          MISSING=""
          for PKG in codeam-cli @codeam/shared; do
            FOUND=0
            # The registry's read replicas lag a publish by seconds — retry
            # before declaring a miss so a propagation delay isn't an incident.
            for ATTEMPT in 1 2 3 4 5 6; do
              if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
                FOUND=1
                break
              fi
              echo "… $PKG@$VERSION not on the registry yet (attempt $ATTEMPT/6)"
              sleep 20
            done
            if [ "$FOUND" = "1" ]; then
              echo "✓ $PKG@$VERSION is live on npm"
            else
              echo "::error::$PKG@$VERSION is NOT on npm — the publish did not land."
              MISSING="$MISSING $PKG"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Release ${GITHUB_REF_NAME} is INCOMPLETE — missing on npm:$MISSING." \
                 "Most likely cause: the NPM_TOKEN repo secret expired (granular npm" \
                 "tokens expire after 90 days). Mint a new Automation token with publish" \
                 "rights on codeam-cli AND the @codeam scope, update NPM_TOKEN, then" \
                 "re-run the failed jobs — the publish guards make retries idempotent."
            exit 1
          fi

  # ── Make a failed release impossible to miss ──────────────────────────────
  # Runs only when something upstream failed. Posts the tag + which jobs failed
  # to Discord so an expired token / broken publish surfaces the same day
  # instead of four releases later.
  notify-failure:
    name: Alert on release failure
    needs:
      [setup, publish-shared, publish-cli, publish-box, publish-vsc, publish-jetbrains, release, verify-published]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_SHARED: ${{ needs.publish-shared.result }}
          R_CLI: ${{ needs.publish-cli.result }}
          R_BOX: ${{ needs.publish-box.result }}
          R_VSC: ${{ needs.publish-vsc.result }}
          R_JB: ${{ needs.publish-jetbrains.result }}
          R_RELEASE: ${{ needs.release.result }}
          R_VERIFY: ${{ needs.verify-published.result }}
        run: |
          set -uo pipefail
          FAILED=""
          add() { [ "$2" = "failure" ] && FAILED="$FAILED $1"; return 0; }
          add "publish-shared"    "$R_SHARED"
          add "publish-cli"       "$R_CLI"
          add "publish-box"       "$R_BOX"
          add "publish-vsc"       "$R_VSC"
          add "publish-jetbrains" "$R_JB"
          add "release"           "$R_RELEASE"
          add "verify-published"  "$R_VERIFY"
          [ -n "$FAILED" ] || FAILED=" (see the run)"
          MSG=$(printf '%s\n%s\n%s' \
            "🚨 **Release $TAG FAILED** — failing jobs:$FAILED" \
            "If a publish job failed, check NPM_TOKEN expiry first (granular npm tokens last 90 days)." \
            "$RUN_URL")
          echo "$MSG"
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK is not set — the failure was NOT announced." \
                 "Add the repo secret (Settings → Secrets and variables → Actions) so a broken" \
                 "release pings Discord. See README → Releases & changelogs."
            exit 0
          fi
          jq -n --arg c "$MSG" '{content:$c, flags:4}' \
            | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK"

  # ── Release notes → #changelog (Discord) + Announcements (Discussions) ───
  #
  # SEPARATE from `notify-success` on purpose. That job posts a one-line "it
  # shipped" ping to the release-notifications channel and must stay exactly as
  # it is; this one publishes the full NOTES to the changelog channel, which is
  # a different audience reading for a different reason.
  #
  # The notes are read back from the GitHub Release rather than passed between
  # jobs: `release` already generates them with git-cliff and sets them as the
  # release body, so re-reading is one API call and cannot drift from what is
  # published. It also means this job needs no artifact plumbing.
  publish-changelog:
    name: Publish release notes (changelog)
    needs: [setup, release, verify-published]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      discussions: write
    steps:
      - name: Publish the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.setup.outputs.version }}
          REPO: ${{ github.repository }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          set -uo pipefail

          # The release body IS the notes (git-cliff output, set by the
          # `release` job). Empty is legitimate: a tag whose commits were all
          # skippable chores produces no notes, and announcing an empty
          # changelog is worse than announcing nothing.
          NOTES=$(gh release view "$TAG" --repo "$REPO" --json body -q .body 2>/dev/null || true)
          if [ -z "${NOTES// /}" ]; then
            echo "::notice::No release notes for $TAG (git-cliff found no conventional commits) — nothing to publish."
            exit 0
          fi

          # ── Discord ──────────────────────────────────────────────────────
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning::DISCORD_CHANGELOG_WEBHOOK is not set — the notes were NOT posted to Discord." \
                 "Add the repo secret (Settings → Secrets and variables → Actions)."
          else
            # Discord caps `content` at 2000 characters and REJECTS the whole
            # message when it is longer, so the notes are split on line
            # boundaries — never mid-line, which would break the markdown.
            printf '%s\n' "$NOTES" > notes.md
            HEADER="📝 **Release $TAG** — codeam-cli@$VERSION · @codeam/shared@$VERSION"
            python3 - "$HEADER" "$RELEASE_URL" <<'PYEOF' > chunks.jsonl
          import json, sys
          header, url = sys.argv[1], sys.argv[2]
          lines = open('notes.md', encoding='utf-8').read().splitlines()
          LIMIT = 1900          # headroom under Discord's 2000
          chunks, cur = [], header
          for ln in lines:
              # A single monstrous line still has to go somewhere: send it on
              # its own and let Discord truncate rather than dropping it.
              piece = ln if len(ln) <= LIMIT else ln[:LIMIT]
              if len(cur) + 1 + len(piece) > LIMIT:
                  chunks.append(cur)
                  cur = piece
              else:
                  cur = f"{cur}\n{piece}" if cur else piece
          if cur:
              chunks.append(cur)
          chunks.append(url)
          for c in chunks:
              print(json.dumps({"content": c, "flags": 4}))
          PYEOF
            n=0
            while IFS= read -r payload; do
              n=$((n+1))
              code=$(printf '%s' "$payload" \
                | curl -sS -o /dev/null -w '%{http_code}' -X POST \
                    -H 'Content-Type: application/json' -d @- "$WEBHOOK")
              echo "discord chunk $n -> $code"
              # Webhooks are rate-limited (5/2s per webhook); a short pause is
              # cheaper than handling a 429 retry.
              sleep 1
            done < chunks.jsonl
          fi

          # ── GitHub Discussions (Announcements) ───────────────────────────
          # Idempotent: a re-run of this workflow must not post the same
          # changelog twice, so an existing discussion for this tag wins.
          TITLE="Release $TAG"
          EXISTING=$(gh api graphql -f query="
            { search(query: \"repo:$REPO in:title \\\"$TITLE\\\"\", type: DISCUSSION, first: 5) {
                nodes { ... on Discussion { title url } } } }" \
            --jq '.data.search.nodes[] | select(.title == "'"$TITLE"'") | .url' 2>/dev/null | head -1 || true)
          if [ -n "${EXISTING:-}" ]; then
            echo "::notice::Discussion for $TAG already exists: $EXISTING"
            exit 0
          fi

          REPO_ID=$(gh api graphql -f query="{ repository(owner: \"${REPO%%/*}\", name: \"${REPO##*/}\") { id } }" --jq .data.repository.id)
          CAT_ID=$(gh api graphql -f query="
            { repository(owner: \"${REPO%%/*}\", name: \"${REPO##*/}\") {
                discussionCategories(first: 20) { nodes { id slug } } } }" \
            --jq '.data.repository.discussionCategories.nodes[] | select(.slug == "announcements") | .id')
          if [ -z "${CAT_ID:-}" ]; then
            echo "::warning::No 'announcements' discussion category — notes not posted to Discussions."
            exit 0
          fi

          BODY=$(printf '%s\n\n%s\n' "$NOTES" "[Full release]($RELEASE_URL)")
          gh api graphql \
            -f query='mutation($repo:ID!,$cat:ID!,$title:String!,$body:String!){
              createDiscussion(input:{repositoryId:$repo,categoryId:$cat,title:$title,body:$body}){
                discussion { url } } }' \
            -f repo="$REPO_ID" -f cat="$CAT_ID" -f title="$TITLE" -f body="$BODY" \
            --jq .data.createDiscussion.discussion.url

  # ── Release succeeded → Discord ──────────────────────────────────────────
  notify-success:
    name: Announce release
    needs: [setup, verify-published, release]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.setup.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          MSG=$(printf '%s\n%s' \
            "🚀 **Release $TAG published** — codeam-cli@$VERSION + @codeam/shared@$VERSION verified on npm; VS Code + JetBrains artifacts attached to the GitHub release." \
            "$RUN_URL")
          echo "$MSG"
          [ -n "${WEBHOOK:-}" ] || { echo "::warning::DISCORD_RELEASE_WEBHOOK not set"; exit 0; }
          jq -n --arg c "$MSG" '{content:$c, flags:4}' \
            | curl -sS -o /dev/null -w 'discord %{http_code}\n' -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK"
