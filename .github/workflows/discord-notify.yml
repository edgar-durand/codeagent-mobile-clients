# Reusable Discord notifier for scheduled/nightly workflows.
#
# Call as a final job with `needs: [<all jobs>]` + `if: always()` +
# `secrets: inherit`. It summarises THIS run's jobs via the API (the called
# workflow shares the caller's run id) and posts to #ci_notifications.
# Scheduled runs post ALWAYS (green or red — nobody watches the Actions tab
# at night); pull_request runs post only on failure. Cancelled/superseded
# runs stay quiet. Missing DISCORD_RELEASE_WEBHOOK → warning, never a red job.
# Owner request 2026-08-20; same pattern as ci.yml notify-discord.
name: Discord notify (reusable)

on:
  workflow_call: {}

jobs:
  post:
    name: Results → Discord
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Summarise jobs and post
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WF_NAME: ${{ github.workflow }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          JOBS=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
                 --jq '.jobs[] | select(.name | endswith("Results → Discord") | not) | [.name, (.conclusion // .status)] | @tsv')
          FAILED=0; CANCELLED=0; LINES=""
          while IFS=$'\t' read -r NAME RES; do
            [ -z "$NAME" ] && continue
            case "$RES" in
              success)   ICON="✅";;
              skipped)   ICON="⏭️";;
              cancelled) ICON="⚪"; CANCELLED=1;;
              failure)   ICON="❌"; FAILED=1;;
              *)         ICON="❔";;
            esac
            LINES="$LINES"$'\n'"$ICON $NAME"
          done <<< "$JOBS"
          if [ "$CANCELLED" = "1" ]; then
            echo "Run superseded/cancelled — staying quiet."
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ] && [ "$FAILED" = "0" ]; then
            echo "Green PR run — staying quiet."
            exit 0
          fi
          if [ "$FAILED" = "1" ]; then HEAD="❌ **$WF_NAME FAILED**"; else HEAD="✅ **$WF_NAME passed**"; fi
          case "$EVENT" in
            schedule) CTX="nightly on $REF";;
            *)        CTX="$EVENT on $REF @ ${SHA:0:8}";;
          esac
          MSG=$(printf '%s · clients · %s%s\n%s' "$HEAD" "$CTX" "$LINES" "$RUN_URL")
          echo "$MSG"
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK not set — result not posted."
            exit 0
          fi
          jq -n --arg c "$MSG" '{content:$c, flags:4}' \
            | curl -sS -o /dev/null -w 'discord %{http_code}\n' -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK"
