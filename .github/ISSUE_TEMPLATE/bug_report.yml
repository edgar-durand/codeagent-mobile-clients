name: Bug report
description: Something is broken in the CLI or one of the IDE plugins.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Mobile-app, account, or billing
        problems are handled through the in-app Help & FAQ — please use the link
        on the issue chooser for those. This template is for the CLI and IDE plugins.

  - type: dropdown
    id: app
    attributes:
      label: Which client is affected?
      options:
        - codeam-cli
        - VS Code / Cursor / Windsurf extension
        - JetBrains plugin
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area is affected?
      options:
        - Pairing / device linking
        - Command relay (SSE / polling)
        - Claude Code PTY / output streaming
        - Agent strategies (Copilot, Cursor, Windsurf, JetBrains AI, …)
        - Selector / interactive prompt handling
        - Pricing / usage / context window
        - Install / update / autoupdate
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Client version
      description: Run `codeam --version` or check the extension/plugin page.
      placeholder: 2.16.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14.4 / Ubuntu 22.04 / Windows 11"
    validations:
      required: true

  - type: input
    id: ide
    attributes:
      label: IDE version (plugin bugs only)
      placeholder: "VS Code 1.95 / IntelliJ IDEA 2024.1 / Cursor 0.42"

  - type: input
    id: node
    attributes:
      label: Node version (CLI bugs only)
      description: Run `node --version`.
      placeholder: v20.11.1

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker — client is unusable
        - Major — core feature broken, no workaround
        - Minor — feature broken but has a workaround
        - Cosmetic — wrong output, typo, UX nit
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often (most of the time)
        - Sometimes (intermittent)
        - Once / could not reproduce
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `codeam pair`
        2. Enter the code in the mobile app
        3. Send "hello" from the phone
        4. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (CLI stderr, VS Code "CodeAgent Mobile" output channel, or IDE log)
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, screen recordings, network conditions (corporate proxy / VPN), anything else that could help.

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched existing issues and could not find a duplicate
          required: true
        - label: I am on the latest version of the affected client
          required: true
