name: Bug report
description: Something is broken — in the mobile app, on the backend, in the CLI, or in one of the IDE plugins.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Just the basics — title, where it broke, what you expected, what
        actually happened. Everything else is optional; a maintainer will
        ask for versions / logs if they need them.

  - type: dropdown
    id: app
    attributes:
      label: Where did this happen?
      options:
        - Mobile app (iOS / Android)
        - Backend / API
        - codeam-cli
        - VS Code / Cursor / Windsurf extension
        - JetBrains plugin
        - Not sure
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: A sentence or two is fine. Screenshots and screen recordings welcome — drag them in.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can someone else trigger the same bug? Skip if you can't reproduce it.
      placeholder: |
        1. Open the mobile app
        2. Tap Sessions → Codespaces
        3. …

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Optional — only fill in if it adds something the "what happened" doesn't already convey.

  - type: input
    id: version
    attributes:
      label: Version (optional)
      description: Mobile build number, `codeam --version`, extension version — whatever you can grab quickly.
      placeholder: "Mobile 3.0.0 (build 68) / codeam-cli 2.24.0 / VS Code extension 2.24.0"

  - type: input
    id: os
    attributes:
      label: Operating system (optional)
      placeholder: "iOS 18 / Android 16 / macOS 14.4 / Ubuntu 22.04 / Windows 11"

  - type: dropdown
    id: severity
    attributes:
      label: Severity (optional)
      options:
        - Not set
        - Blocker — feature is unusable
        - Major — core feature broken, no workaround
        - Minor — feature broken but has a workaround
        - Cosmetic — wrong copy, typo, UX nit

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: CLI stderr, VS Code "CodeAgent Mobile" output channel, IDE log, server response body, anything else that helps.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: Corporate proxy, VPN, A/B flag you toggled, account email if support has to look it up — anything you'd mention in chat.

  - type: checkboxes
    id: checks
    attributes:
      label: One quick check
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
