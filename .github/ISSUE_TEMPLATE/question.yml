name: Question / usage help
description: Ask how to use, configure, or integrate any part of CodeAgent.
labels: [question]
body:
  - type: dropdown
    id: app
    attributes:
      label: Where's your question about?
      options:
        - Mobile app (iOS / Android)
        - Backend / API
        - codeam-cli
        - VS Code / Cursor / Windsurf extension
        - JetBrains plugin
        - Not sure yet
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: The outcome you want — not just the command you tried.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried so far? (optional)
      description: Commands, settings, docs you already looked at.

  - type: textarea
    id: context
    attributes:
      label: Environment / context (optional)
      placeholder: "Mobile build / OS / IDE / corporate proxy / monorepo / etc."

  - type: checkboxes
    id: checks
    attributes:
      label: One quick check
      options:
        - label: I searched existing issues, discussions, and the README
          required: true
