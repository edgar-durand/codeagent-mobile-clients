name: Feature request
description: Suggest a capability or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Tell us the pain you're hitting and the shape of the fix you'd
        like to see. We'll come back with questions if we need more.

  - type: dropdown
    id: app
    attributes:
      label: Where would this land?
      options:
        - Mobile app (iOS / Android)
        - Backend / API
        - codeam-cli
        - VS Code / Cursor / Windsurf extension
        - JetBrains plugin
        - All / cross-cutting
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The user pain or missing capability. Skip jumping to an implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional)
      description: Rough sketches, mockups, copy, CLI signatures — anything that paints the picture.

  - type: textarea
    id: usecase
    attributes:
      label: Concrete use case (optional)
      placeholder: |
        "I open a JetBrains project on a remote SSH host and want pairing
        to survive connection drops without re-scanning the QR code."

  - type: dropdown
    id: impact
    attributes:
      label: How important is this to you? (optional)
      options:
        - Not set
        - Nice to have
        - Would meaningfully improve my workflow
        - Blocking my usage today

  - type: checkboxes
    id: checks
    attributes:
      label: One quick check
      options:
        - label: I searched existing issues and discussions for this idea
          required: true
