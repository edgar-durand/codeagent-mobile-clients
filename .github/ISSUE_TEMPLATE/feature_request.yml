name: Feature request
description: Suggest a capability or improvement for one of the clients.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This template is for the CLI and IDE plugins in this repo. Mobile-app and
        backend feature requests are tracked separately — please use the in-app
        feedback channel for those.

  - type: dropdown
    id: app
    attributes:
      label: Which client would this affect?
      options:
        - codeam-cli
        - VS Code / Cursor / Windsurf extension
        - JetBrains plugin
        - All of the above
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user pain or missing capability. Avoid jumping straight to an implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see change? Rough sketches, mockups, or CLI signatures all welcome.

  - type: textarea
    id: usecase
    attributes:
      label: Concrete use case
      description: Walk us through a real situation where you would use this.
      placeholder: |
        "I open a JetBrains project on a remote SSH host and want pairing to survive
        connection drops without re-scanning the QR code."

  - type: checkboxes
    id: audience
    attributes:
      label: Who would benefit?
      options:
        - label: Solo developer
        - label: Team / multiple paired devices
        - label: Agency / contractor working across many repos
        - label: AI power user (heavy Claude / Copilot / Cursor usage)
        - label: Other

  - type: dropdown
    id: impact
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would meaningfully improve my workflow
        - Blocking my usage today
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched existing issues and discussions for this idea
          required: true
