<!--
  Plugin Marketplace icon (dark theme). Same as the light variant but
  swapping the white tile for a near-black so the violet→fuchsia
  "</>" mark stays legible against IDE dark themes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="9" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
  <g stroke="url(#brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="15,15 9,20 15,25"/>
    <polyline points="25,15 31,20 25,25"/>
    <line x1="22.5" y1="12.5" x2="17.5" y2="27.5"/>
  </g>
</svg>
